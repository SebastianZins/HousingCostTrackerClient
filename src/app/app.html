<div class="page">
  <app-sidebar #sidebar></app-sidebar>
  <app-topbar [sideBarRef]="sidebar"></app-topbar>

  <main>
    <router-outlet />
  </main>
</div>

<p-dialog
  [visible]="configService.useTestDataDialogShown()"
  (onHide)="configService.useTestDataDialogShown.set(false)"
  #useTestDataDialog
  header="Verwende Test Daten?"
  [dismissableMask]="true"
  [modal]="true"
>
  <div
    style="padding: 1rem 2rem; max-width: 500px; display: flex; flex-direction: column; gap: 1rem"
  >
    <div style="font-size: large">Sollen vordefinierte Test Daten geladen werden?</div>
    <div style="font-size: small">
      Die API ist nicht erreichbar. Die App kann aber auch ohne eine API Verbindung getestet werden,
      indem Daten im lokalen Speicher des Browsers gespeichert werden.
    </div>
    <div style="font-size: 11px">
      Falls bereits Daten im lokalen Speicher gespeichert sind, werden sie damit überschrieben.
    </div>
  </div>
  <div style="display: flex; justify-content: end; gap: 1rem">
    <button
      pButton
      severity="secondary"
      (click)="configService.useTestData.next(false); useTestDataDialog.close($event)"
    >
      Nein
    </button>
    <button pButton (click)="configService.useTestData.next(true); useTestDataDialog.close($event)">
      Ja
    </button>
  </div>
</p-dialog>

<p-toast />
