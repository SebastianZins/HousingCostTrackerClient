<p-toolbar>
  <ng-template #start>
    <div>
      <a
        class="home-button"
        pButton
        iconOnly
        [rounded]="true"
        [text]="true"
        size="large"
        routerLink="/"
      >
        <i class="pi pi-euro" style="font-size: 2.5rem"></i>
      </a>
      <button
        class="menu-button"
        pButton
        iconOnly
        [rounded]="true"
        [text]="true"
        size="large"
        (click)="sideBarRef.toggleSidebar()"
      >
        <i class="pi pi-euro" style="font-size: 2.5rem"></i>
      </button>
    </div>
    <div class="button-group">
      <a
        pButton
        [severity]="currentRoute === '/' || currentRoute === '/landing' ? 'primary' : 'secondary'"
        routerLink="/"
        >Schnell-Eingabe</a
      >
      <a
        pButton
        [severity]="currentRoute === '/overview' ? 'primary' : 'secondary'"
        routerLink="/overview"
        >Übersicht</a
      >
      <a
        pButton
        [severity]="currentRoute === '/dashboard' ? 'primary' : 'secondary'"
        routerLink="/dashboard"
        >Dashboard</a
      >
    </div>
  </ng-template>
  <ng-template #end>
    <ng-container *ngTemplateOutlet="topBarService.headerTemplate()"></ng-container>
  </ng-template>
</p-toolbar>
