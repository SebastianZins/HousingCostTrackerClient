<p-drawer #drawerRef [(visible)]="visible">
  <ng-template #headless>
    <div>
      <div class="header">
        <div class="header-title">
          <button pButton iconOnly rounded text size="large" (click)="toggleSidebar()">
            <i class="pi pi-euro" style="font-size: 2.5rem"> </i>
          </button>
          <div>Housing Cost Tracker</div>
        </div>
        <button
          pButton
          (click)="drawerRef.close($event)"
          icon="pi pi-times"
          severity="secondary"
          rounded
          text
          size="large"
        >
          <i class="pi pi-times"> </i>
        </button>
      </div>
      <p-divider> </p-divider>
      <div class="nav-items">
        <button
          pButton
          [severity]="currentRoute === '/' || currentRoute === '/landing' ? 'primary' : 'secondary'"
          (click)="navigate('/')"
        >
          Schnell-Eingabe
        </button>
        <button
          pButton
          [severity]="currentRoute === '/overview' ? 'primary' : 'secondary'"
          (click)="navigate('/overview')"
        >
          Übersicht
        </button>
        <button
          pButton
          [severity]="currentRoute === '/dashboard' ? 'primary' : 'secondary'"
          (click)="navigate('/dashboard')"
        >
          Dashboard
        </button>
      </div>
    </div>
  </ng-template>
</p-drawer>
